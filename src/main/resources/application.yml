spring:
  application:
    name: polizas-api
  datasource:
    # Credenciales siempre por variables de entorno; nunca en el repositorio.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polizas}
    username: ${DB_USERNAME:polizas}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  error:
    # Los errores los construye GlobalExceptionHandler; nunca se exponen trazas.
    include-stacktrace: never
    include-message: never

polizas:
  # Zona horaria de negocio para fechas efectivas y de cancelación.
  zona-horaria: America/Bogota
  # Valores del header del contrato remoto. "user" se reemplaza por el usuario
  # autenticado cuando se active Spring Security (Etapa 5/7).
  canal: PORTAL_CLIENTES
  usuario-sistema: system_user
  # Mock externo del CORE (POST /core-mock/evento). La clave llega por entorno; si está vacía,
  # el endpoint rechaza todas las solicitudes (401). No hay valor por defecto en el código.
  core-mock:
    api-key: ${CORE_MOCK_API_KEY:}
  integracion:
    # 1 intento inicial + 3 reintentos (supuesto S-08).
    max-intentos: 4
    # SIMULADO (por defecto, nada llega al CORE real) | WEBLOGIC (requiere todo lo de abajo).
    adaptador: ${CORE_ADAPTADOR:SIMULADO}
    procesador:
      habilitado: ${CORE_PROCESADOR_HABILITADO:true}
      # Requisito: 3 reintentos con intervalo de un minuto (max-intentos = 4).
      intervalo-reintento: ${CORE_INTERVALO_REINTENTO:1m}
      # true: un resultado incierto se reenvía con la misma Idempotency-Key (supuesto S-25).
      # Poner false si el CORE no garantiza idempotencia: pasará a FALLIDA para revisión.
      reintentar-resultados-inciertos: ${CORE_REINTENTAR_INCIERTOS:true}
      intervalo-sondeo: 5s
      tamano-lote: 20
      umbral-operacion-interrumpida: 2m
    simulado:
      # EXITO | ERROR_HTTP | TIMEOUT | FALLA_Y_RECUPERA
      modo: ${CORE_SIMULADO_MODO:EXITO}
      fallos-antes-de-exito: ${CORE_SIMULADO_FALLOS:2}
      http-status: ${CORE_SIMULADO_HTTP_STATUS:503}
      latencia: ${CORE_SIMULADO_LATENCIA:0ms}
    weblogic:
      # Sin valores por defecto: URLs, credenciales y certificados se inyectan desde fuera
      # (variables de entorno / gestor de secretos). Nunca se versionan.
      mutaciones-url: ${WEBLOGIC_MUTACIONES_URL:}
      token-url: ${WEBLOGIC_TOKEN_URL:}
      client-id: ${WEBLOGIC_CLIENT_ID:}
      client-secret: ${WEBLOGIC_CLIENT_SECRET:}
      scope: ${WEBLOGIC_SCOPE:}
      connect-timeout: ${WEBLOGIC_CONNECT_TIMEOUT:5s}
      read-timeout: ${WEBLOGIC_READ_TIMEOUT:10s}
      key-store-path: ${WEBLOGIC_KEYSTORE_PATH:}
      key-store-password: ${WEBLOGIC_KEYSTORE_PASSWORD:}
      key-store-type: ${WEBLOGIC_KEYSTORE_TYPE:PKCS12}
      trust-store-path: ${WEBLOGIC_TRUSTSTORE_PATH:}
      trust-store-password: ${WEBLOGIC_TRUSTSTORE_PASSWORD:}
      trust-store-type: ${WEBLOGIC_TRUSTSTORE_TYPE:PKCS12}
      protocolos-tls: TLSv1.3,TLSv1.2
  ipc:
    # Mes de IPC aplicable al renovar (supuesto S-10):
    # MES_INICIO_NUEVA_VIGENCIA | MES_ANTERIOR_INICIO_NUEVA_VIGENCIA | MES_FECHA_RENOVACION
    regla-mes: MES_INICIO_NUEVA_VIGENCIA
    # Se exige la clave con periodo ipc_<aaaa>_<mm> (p. ej. ipc_2027_01). El respaldo con la
    # clave heredada ipc_<mes> (p. ej. ipc_enero), que NO distingue año, está deshabilitado.
    permitir-clave-mensual-sin-anio: ${IPC_PERMITIR_CLAVE_MENSUAL:false}

# ---------------------------------------------------------------------------
# Observabilidad (Etapa 7)
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario: nada de env, beans, heapdump ni configprops.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        polizas.integracion.envio: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**, /core-mock/**

logging:
  pattern:
    # El correlationId de cada solicitud u operación aparece en todas las líneas de log.
    level: "%5p [corr=%X{correlationId:-}]"
